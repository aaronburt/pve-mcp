services:
  pve-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/aaronburt/pve-mcp-go:latest
    container_name: pve-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MCP_BIND_ADDRESS=0.0.0.0
      - PORT=8080
