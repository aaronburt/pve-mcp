services:
  pve-mcp:
    image: ghcr.io/aaronburt/pve-mcp-go:latest
    container_name: pve-mcp
    restart: unless-stopped
    # The app writes nothing to disk and needs no Linux capabilities.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      - MCP_BIND_ADDRESS=0.0.0.0
      - PORT=8080
      # Web UI is off unless MCP_UI_ENABLED=true is set in .env (with MCP_UI_TOKEN).
      - MCP_UI_BIND_ADDRESS=0.0.0.0
      - MCP_UI_ALLOW_INSECURE_BIND=true
