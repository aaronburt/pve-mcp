<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pve-mcp</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="login" hidden>
  <form id="login-form">
    <h1>pve-mcp</h1>
    <label for="token" class="label">UI token</label>
    <input id="token" type="password" autocomplete="off" required>
    <button type="submit">Sign in</button>
    <p id="login-error" role="alert"></p>
  </form>
</section>

<main id="app" hidden>
  <header id="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true">P</span>
      <strong>pve-mcp</strong>
    </div>
    <div class="bar-end">
      <label class="label" for="level">Log level</label>
      <select id="level">
        <option>debug</option><option>info</option><option>warn</option><option>error</option>
      </select>
      <button id="logout" type="button">Sign out</button>
    </div>
  </header>

  <section id="stats" class="stats">
    <div class="stat">
      <div class="label">Mutations</div>
      <div id="n-mut" class="num k-mut">0</div>
      <div class="sub">In the event buffer</div>
    </div>
    <div class="stat">
      <div class="label">Dry-runs</div>
      <div id="n-dry" class="num k-dry">0</div>
      <div class="sub">Nothing applied</div>
    </div>
    <div class="stat">
      <div class="label">Errors</div>
      <div id="n-err" class="num k-err">0</div>
      <div class="sub">In the event buffer</div>
    </div>
    <div class="stat">
      <div class="label">Proxmox</div>
      <div id="pve" class="num">…</div>
      <div id="pve-sub" class="sub"></div>
    </div>
  </section>

  <section id="controls">
    <div id="filters" class="segs" role="group" aria-label="Filter events">
      <button data-filter="all" class="on" type="button">All</button>
      <button data-filter="mutations" type="button">Mutations</button>
      <button data-filter="dryruns" type="button">Dry-runs</button>
      <button data-filter="reads" type="button">Reads</button>
      <button data-filter="errors" type="button">Errors</button>
      <button data-filter="logs" type="button">Server logs</button>
    </div>
    <div class="joined controls-end" role="group" aria-label="Event tools">
      <div id="search-wrap" hidden>
        <input id="search" type="search" placeholder="Search events" aria-label="Search events">
      </div>
      <button id="search-toggle" type="button" aria-label="Search events" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg>
      </button>
      <button id="pause" type="button">Pause</button>
      <button id="clear" type="button">Clear</button>
    </div>
  </section>

  <div class="evhead label">
    <span>Time</span>
    <span>Kind</span>
    <span>Event</span>
  </div>
  <div id="rows"></div>
  <p id="empty">No events yet.</p>

  <footer id="meta">
    <span id="conn"></span>
    <span id="transport"></span>
    <span id="tools"></span>
    <span id="heap"></span>
    <span id="uptime"></span>
    <span id="buf"></span>
  </footer>
</main>
<script src="/app.js"></script>
</body>
</html>
